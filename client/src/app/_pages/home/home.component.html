<div class="flex justify-center pt-56">
  <div class="h-screen">
    <h1 class="text-4xl text-center font-bold my-10">
      Welcome to
      <span class="text-5xl text-green-800">MyApp</span>
    </h1>
    <div class="flex items-center gap-5 justify-center">
      @if(authService.getUserDetail())
      {
        You are logged in as
        <span class="font-bold bg-blue-600 rounded-md p-2 text-white">
          <h1 class="text-2xl">
            {{ authService.getUserDetail()?.fullName }}
          </h1>
        </span>
      }
      @else
      {
        <h1 class="text-2xl">You are not logged in</h1>
        <a routerLink="/login">
          <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
            Login
          </button>
        </a>
      }
    </div>
  </div>
</div>
